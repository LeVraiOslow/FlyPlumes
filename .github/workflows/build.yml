name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Mets 25 ici (et maven.compiler.release=25 dans pom.xml)
          # si ta version de Paper l'exige.
          java-version: '21'
          cache: maven

      - name: Compiler avec Maven
        run: mvn -B clean package

      - name: Envoyer le jar
        uses: actions/upload-artifact@v4
        with:
          name: FlyPlumes
          path: target/FlyPlumes-*.jar
          if-no-files-found: error
